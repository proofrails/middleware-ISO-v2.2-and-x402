<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc"><title id="title">ProofRails x402 Flare mainnet product flow</title><desc id="desc">A buyer reads product configuration, signs a USDt0 EIP-3009 authorization, the ProofRails facilitator settles it on Flare, the resource is unlocked, and ProofRails creates and anchors a receipt.</desc><defs><linearGradient id="bg"><stop stop-color="#07111f"/><stop offset="1" stop-color="#180a1c"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#e11d8a"/></marker></defs><rect width="1440" height="720" rx="28" fill="url(#bg)"/><text x="65" y="65" fill="#f8fafc" font-family="Inter,Arial" font-size="30" font-weight="700">Flare mainnet paid-resource flow</text><text x="65" y="99" fill="#94a3b8" font-family="Inter,Arial" font-size="17">The currently proven ProofRails-specific sequence</text><g font-family="Inter,Arial"><g stroke-width="2"><rect x="65" y="155" width="230" height="105" rx="18" fill="#10223a" stroke="#38bdf8"/><text x="180" y="198" fill="#f8fafc" text-anchor="middle" font-size="20" font-weight="700">Buyer / agent</text><text x="180" y="228" fill="#cbd5e1" text-anchor="middle" font-size="14">wallet + EIP-3009 signer</text><rect x="425" y="155" width="250" height="105" rx="18" fill="#25143b" stroke="#a78bfa"/><text x="550" y="198" fill="#f8fafc" text-anchor="middle" font-size="20" font-weight="700">x402test product</text><text x="550" y="228" fill="#cbd5e1" text-anchor="middle" font-size="14">config, unlock, delivery</text><rect x="805" y="155" width="250" height="105" rx="18" fill="#10271f" stroke="#34d399"/><text x="930" y="198" fill="#f8fafc" text-anchor="middle" font-size="20" font-weight="700">X402Facilitator</text><text x="930" y="228" fill="#cbd5e1" text-anchor="middle" font-size="14">USD₮0 settlement on Flare</text><rect x="1185" y="155" width="190" height="105" rx="18" fill="#35131f" stroke="#fb7185"/><text x="1280" y="198" fill="#f8fafc" text-anchor="middle" font-size="20" font-weight="700">ProofRails</text><text x="1280" y="228" fill="#cbd5e1" text-anchor="middle" font-size="14">receipt + anchor</text></g><g stroke="#e11d8a" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M180 290v58h370v-58"/><path d="M550 385h380v-95"/><path d="M930 420H550v70"/><path d="M550 525h730v-235"/></g><g fill="#0f172a" stroke="#475569"><rect x="255" y="316" width="220" height="48" rx="10"/><rect x="645" y="360" width="250" height="48" rx="10"/><rect x="645" y="436" width="250" height="48" rx="10"/><rect x="820" y="505" width="300" height="48" rx="10"/></g><g fill="#e2e8f0" font-size="14" text-anchor="middle"><text x="365" y="346">1. Fetch live price + contracts</text><text x="770" y="390">2. Sign authorization; settle once</text><text x="770" y="466">3. Return payment ID + tx hash</text><text x="970" y="535">4. Unlock resource and create receipt</text></g><rect x="65" y="595" width="1310" height="72" rx="14" fill="#21101a" stroke="#e11d8a"/><text x="95" y="625" fill="#f9a8d4" font-size="15" font-weight="700">Interoperability boundary</text><text x="95" y="650" fill="#cbd5e1" font-size="13">This sequence is live and mainnet-tested, but it is not yet canonical x402 V2. Config and unlock are separate calls,</text><text x="95" y="670" fill="#cbd5e1" font-size="13">and the official v2 client cannot parse the current custom challenge.</text></g></svg>