<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc"><title id="title">ProofRails evidence model</title><desc id="desc">A receipt, ISO-style XML, transaction context and optional credentials are inventoried in a signed manifest and evidence ZIP. The ZIP hash is committed to an EvidenceAnchor contract on Flare.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#180a1c"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#e11d8a"/></marker></defs><rect width="1440" height="680" rx="28" fill="url(#bg)"/><text x="68" y="66" fill="#f8fafc" font-family="Inter,Arial" font-size="30" font-weight="700">What the anchor actually proves</text><text x="68" y="99" fill="#94a3b8" font-family="Inter,Arial" font-size="17">The chain stores a compact commitment. The evidence remains readable and portable offchain.</text><g stroke="#e11d8a" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M410 340h160"/><path d="M870 340h150"/></g><g font-family="Inter,Arial"><rect x="65" y="155" width="345" height="405" rx="22" fill="#0f2135" stroke="#38bdf8" stroke-width="2"/><text x="100" y="202" fill="#f8fafc" font-size="23" font-weight="700">Evidence inputs</text><g fill="#cbd5e1" font-size="17"><text x="110" y="254">receipt.json</text><text x="110" y="302">tip.json / payment context</text><text x="110" y="350">pain.001 and other XML</text><text x="110" y="398">optional credential / IVMS data</text><text x="110" y="446">manifest.json + file hashes</text><text x="110" y="494">manifest.sig + public key</text></g><g fill="#38bdf8"><circle cx="91" cy="248" r="6"/><circle cx="91" cy="296" r="6"/><circle cx="91" cy="344" r="6"/><circle cx="91" cy="392" r="6"/><circle cx="91" cy="440" r="6"/><circle cx="91" cy="488" r="6"/></g><rect x="570" y="205" width="300" height="270" rx="22" fill="#25143b" stroke="#a78bfa" stroke-width="2"/><text x="720" y="262" fill="#f8fafc" text-anchor="middle" font-size="25" font-weight="700">evidence.zip</text><text x="720" y="304" fill="#cbd5e1" text-anchor="middle" font-size="16">Portable proof package</text><rect x="625" y="341" width="190" height="54" rx="10" fill="#140d24" stroke="#c4b5fd"/><text x="720" y="375" fill="#ddd6fe" text-anchor="middle" font-size="16">SHA-256(bundle bytes)</text><text x="720" y="438" fill="#94a3b8" text-anchor="middle" font-size="14">Ed25519 authenticates the manifest</text><rect x="1020" y="185" width="350" height="310" rx="22" fill="#35131f" stroke="#fb7185" stroke-width="2"/><text x="1195" y="242" fill="#f8fafc" text-anchor="middle" font-size="23" font-weight="700">Flare mainnet</text><text x="1195" y="282" fill="#fda4af" text-anchor="middle" font-size="17">EvidenceAnchor</text><rect x="1075" y="320" width="240" height="64" rx="12" fill="#190c12" stroke="#fb7185"/><text x="1195" y="347" fill="#fecdd3" text-anchor="middle" font-size="14">receipt identifier</text><text x="1195" y="371" fill="#fecdd3" text-anchor="middle" font-size="14">bundle hash + timestamp</text><text x="1195" y="434" fill="#cbd5e1" text-anchor="middle" font-size="15">Later verification compares the</text><text x="1195" y="458" fill="#cbd5e1" text-anchor="middle" font-size="15">recomputed hash with this event.</text></g><rect x="65" y="602" width="1305" height="1" fill="#334155"/><text x="68" y="638" fill="#94a3b8" font-family="Inter,Arial" font-size="15">The anchor proves that the exact bundle hash was committed at a point in time. It does not prove legal settlement, invoice validity, KYC status or the truth of every supplied field.</text></svg>