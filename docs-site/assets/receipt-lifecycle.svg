<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc"><title id="title">ProofRails receipt lifecycle</title><desc id="desc">An application submits a payment reference, ProofRails creates and processes a receipt, produces a signed evidence bundle, anchors its hash on Flare, and exposes verification results.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#14091b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#e11d8a"/></marker></defs><rect width="1440" height="560" rx="28" fill="url(#bg)"/><g opacity=".22" stroke="#64748b"><path d="M0 80h1440M0 160h1440M0 240h1440M0 320h1440M0 400h1440M0 480h1440"/><path d="M80 0v560M160 0v560M240 0v560M320 0v560M400 0v560M480 0v560M560 0v560M640 0v560M720 0v560M800 0v560M880 0v560M960 0v560M1040 0v560M1120 0v560M1200 0v560M1280 0v560M1360 0v560"/></g><text x="70" y="68" fill="#f8fafc" font-family="Inter,Arial" font-size="30" font-weight="700">Receipt lifecycle</text><text x="70" y="102" fill="#94a3b8" font-family="Inter,Arial" font-size="17">From payment reference to independently checkable evidence</text><g fill="none" stroke="#e11d8a" stroke-width="4" marker-end="url(#arrow)" filter="url(#glow)"><path d="M280 300h80"/><path d="M550 300h80"/><path d="M820 300h80"/><path d="M1090 300h80"/></g><g font-family="Inter,Arial"><g><rect x="70" y="205" width="210" height="190" rx="18" fill="#10223a" stroke="#38bdf8" stroke-width="2"/><circle cx="110" cy="245" r="22" fill="#0ea5e9"/><text x="110" y="252" fill="white" font-size="20" text-anchor="middle" font-weight="700">1</text><text x="100" y="302" fill="#f8fafc" font-size="21" font-weight="700">Submit</text><text x="100" y="334" fill="#cbd5e1" font-size="15">Transaction hash, chain,</text><text x="100" y="357" fill="#cbd5e1" font-size="15">amount, parties and context</text></g><g><rect x="360" y="205" width="190" height="190" rx="18" fill="#10271f" stroke="#34d399" stroke-width="2"/><circle cx="400" cy="245" r="22" fill="#10b981"/><text x="400" y="252" fill="white" font-size="20" text-anchor="middle" font-weight="700">2</text><text x="390" y="302" fill="#f8fafc" font-size="21" font-weight="700">Process</text><text x="390" y="334" fill="#cbd5e1" font-size="15">Normalize metadata and</text><text x="390" y="357" fill="#cbd5e1" font-size="15">generate ISO-style XML</text></g><g><rect x="630" y="205" width="190" height="190" rx="18" fill="#27143b" stroke="#a78bfa" stroke-width="2"/><circle cx="670" cy="245" r="22" fill="#8b5cf6"/><text x="670" y="252" fill="white" font-size="20" text-anchor="middle" font-weight="700">3</text><text x="660" y="302" fill="#f8fafc" font-size="21" font-weight="700">Bundle</text><text x="660" y="334" fill="#cbd5e1" font-size="15">Manifest, checksums and</text><text x="660" y="357" fill="#cbd5e1" font-size="15">signed file inventory</text></g><g><rect x="900" y="205" width="190" height="190" rx="18" fill="#35131f" stroke="#fb7185" stroke-width="2"/><circle cx="940" cy="245" r="22" fill="#e11d8a"/><text x="940" y="252" fill="white" font-size="20" text-anchor="middle" font-weight="700">4</text><text x="930" y="302" fill="#f8fafc" font-size="21" font-weight="700">Anchor</text><text x="930" y="334" fill="#cbd5e1" font-size="15">Commit the bundle SHA-256</text><text x="930" y="357" fill="#cbd5e1" font-size="15">to EvidenceAnchor on Flare</text></g><g><rect x="1170" y="205" width="200" height="190" rx="18" fill="#2e2410" stroke="#fbbf24" stroke-width="2"/><circle cx="1210" cy="245" r="22" fill="#d97706"/><text x="1210" y="252" fill="white" font-size="20" text-anchor="middle" font-weight="700">5</text><text x="1200" y="302" fill="#f8fafc" font-size="21" font-weight="700">Verify</text><text x="1200" y="334" fill="#cbd5e1" font-size="15">Recompute, check signature,</text><text x="1200" y="357" fill="#cbd5e1" font-size="15">and match the onchain event</text></g></g><text x="70" y="492" fill="#94a3b8" font-family="Inter,Arial" font-size="15">ProofRails records evidence around a payment. It does not custody or transfer the payment itself.</text></svg>