<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">ProofRails evidence model</title><desc id="desc">Receipt and financial-message artifacts are hashed into a signed evidence bundle. The bundle hash is committed through EvidenceAnchor on Flare.</desc><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfcff"/><stop offset="1" stop-color="#fff6fb"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#df1e7d"/></marker></defs><rect x="1" y="1" width="1198" height="518" rx="18" fill="url(#wash)" stroke="#dce3ee"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" fill="#0b1730" font-size="28" font-weight="650">What is signed. What is anchored.</text><text x="48" y="88" fill="#5b6b82" font-size="17">Readable evidence stays offchain; its deterministic bundle hash is committed on Flare.</text><g fill="none" stroke="#df1e7d" stroke-width="3" marker-end="url(#arrow)"><path d="M374 260h48"/><path d="M778 260h48"/></g><g><rect x="48" y="140" width="326" height="250" rx="12" fill="#fff" stroke="#cdd6e4"/><rect x="48" y="140" width="326" height="5" rx="3" fill="#17a7d8"/><text x="75" y="188" fill="#0b1730" font-size="22" font-weight="650">Receipt artifacts</text><text x="75" y="229" fill="#53647b" font-size="17">receipt.json</text><text x="75" y="260" fill="#53647b" font-size="17">payment and business context</text><text x="75" y="291" fill="#53647b" font-size="17">ISO 20022-style XML</text><text x="75" y="322" fill="#53647b" font-size="17">optional supporting files</text><text x="75" y="360" fill="#8a5773" font-size="14" font-family="JetBrains Mono,monospace">HUMAN + MACHINE READABLE</text></g><g><rect x="422" y="140" width="356" height="250" rx="12" fill="#fff" stroke="#cdd6e4"/><rect x="422" y="140" width="356" height="5" rx="3" fill="#df1e7d"/><text x="449" y="188" fill="#0b1730" font-size="22" font-weight="650">Signed evidence.zip</text><text x="449" y="229" fill="#53647b" font-size="17">canonical manifest</text><text x="449" y="260" fill="#53647b" font-size="17">SHA-256 per file</text><text x="449" y="291" fill="#53647b" font-size="17">Ed25519 manifest signature</text><text x="449" y="322" fill="#53647b" font-size="17">verification public key</text><text x="449" y="360" fill="#8a5773" font-size="14" font-family="JetBrains Mono,monospace">PORTABLE INTEGRITY PACKAGE</text></g><g><rect x="826" y="140" width="326" height="250" rx="12" fill="#0b1730" stroke="#0b1730"/><rect x="826" y="140" width="326" height="5" rx="3" fill="#df1e7d"/><text x="853" y="188" fill="#fff" font-size="22" font-weight="650">EvidenceAnchor / Flare</text><text x="853" y="229" fill="#c8d2e1" font-size="17">receipt identifier</text><text x="853" y="260" fill="#c8d2e1" font-size="17">bundle SHA-256</text><text x="853" y="291" fill="#c8d2e1" font-size="17">block and transaction reference</text><text x="853" y="322" fill="#c8d2e1" font-size="17">timestamped commitment event</text><text x="853" y="360" fill="#f9a8d4" font-size="14" font-family="JetBrains Mono,monospace">ONCHAIN COMMITMENT</text></g><line x1="48" y1="434" x2="1152" y2="434" stroke="#dce3ee"/><text x="48" y="475" fill="#0b1730" font-size="17" font-weight="650">Verify:</text><text x="112" y="475" fill="#5b6b82" font-size="17">recompute file hashes</text><circle cx="312" cy="469" r="3" fill="#df1e7d"/><text x="329" y="475" fill="#5b6b82" font-size="17">check the signature</text><circle cx="505" cy="469" r="3" fill="#df1e7d"/><text x="522" y="475" fill="#5b6b82" font-size="17">derive the bundle hash</text><circle cx="726" cy="469" r="3" fill="#df1e7d"/><text x="743" y="475" fill="#5b6b82" font-size="17">compare with the Flare event</text></g></svg>