<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">ProofRails hosted system architecture</title><desc id="desc">Clients use the FastAPI service, which persists receipts in PostgreSQL and queues background work through Redis. Workers write signed artifacts to storage and commit hashes through Flare contracts.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#68788d"/></marker></defs><rect width="1200" height="590" rx="18" fill="#fbfcfe"/><g font-family="Inter,Arial"><text x="55" y="52" fill="#0b1730" font-size="27" font-weight="700">Hosted service architecture</text>
