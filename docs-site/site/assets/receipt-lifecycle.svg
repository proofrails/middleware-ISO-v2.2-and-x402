<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">ProofRails payment evidence pipeline</title><desc id="desc">A blockchain payment is normalized, translated into financial records, packaged into signed evidence, and anchored on Flare for verification.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#df1e7d"/></marker><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfcff"/><stop offset="1" stop-color="#fff6fb"/></linearGradient></defs><rect x="1" y="1" width="1198" height="468" rx="18" fill="url(#wash)" stroke="#dce3ee"/><g opacity=".45" stroke="#edf0f5"><path d="M0 94h1200M0 188h1200M0 282h1200M0 376h1200"/><path d="M120 0v470M240 0v470M360 0v470M480 0v470M600 0v470M720 0v470M840 0v470M960 0v470M1080 0v470"/></g><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" fill="#0b1730" font-size="28" font-weight="650">Payment → finance-ready evidence</text><text x="48" y="88" fill="#5b6b82" font-size="17">ProofRails adds the records and integrity layer that settlement alone does not provide.</text><g fill="none" stroke="#df1e7d" stroke-width="3" marker-end="url(#arrow)"><path d="M242 257h32"/><path d="M468 257h32"/><path d="M694 257h32"/><path d="M920 257h32"/></g><g><rect x="48" y="150" width="194" height="214" rx="12" fill="#fff" stroke="#cdd6e4"/><rect x="48" y="150" width="194" height="5" rx="3" fill="#17a7d8"/><text x="70" y="195" fill="#df1e7d" font-size="14" font-weight="650">01</text><text x="70" y="230" fill="#0b1730" font-size="23" font-weight="650">Observe</text><text x="70" y="265" fill="#53647b" font-size="17">Transaction hash</text><text x="70" y="291" fill="#53647b" font-size="17">Chain and asset</text><text x="70" y="317" fill="#53647b" font-size="17">Payer and recipient</text></g><g><rect x="274" y="150" width="194" height="214" rx="12" fill="#fff" stroke="#cdd6e4"/><rect x="274" y="150" width="194" height="5" rx="3" fill="#df1e7d"/><text x="296" y="195" fill="#df1e7d" font-size="14" font-weight="650">02</text><text x="296" y="230" fill="#0b1730" font-size="23" font-weight="650">Normalize</text><text x="296" y="265" fill="#53647b" font-size="17">Amount and currency</text><text x="296" y="291" fill="#53647b" font-size="17">Business reference</text><text x="296" y="317" fill="#53647b" font-size="17">Structured metadata</text></g><g><rect x="500" y="150" width="194" height="214" rx="12" fill="#fff" stroke="#cdd6e4"/><rect x="500" y="150" width="194" height="5" rx="3" fill="#7656e8"/><text x="522" y="195" fill="#df1e7d" font-size="14" font-weight="650">03</text><text x="522" y="230" fill="#0b1730" font-size="23" font-weight="650">Translate</text><text x="522" y="265" fill="#53647b" font-size="17">Payment records</text><text x="522" y="291" fill="#53647b" font-size="17">Status and returns</text><text x="522" y="317" fill="#53647b" font-size="17">ISO 20022-style XML</text></g><g><rect x="726" y="150" width="194" height="214" rx="12" fill="#fff" stroke="#cdd6e4"/><rect x="726" y="150" width="194" height="5" rx="3" fill="#df1e7d"/><text x="748" y="195" fill="#df1e7d" font-size="14" font-weight="650">04</text><text x="748" y="230" fill="#0b1730" font-size="23" font-weight="650">Package</text><text x="748" y="265" fill="#53647b" font-size="17">Canonical manifest</text><text x="748" y="291" fill="#53647b" font-size="17">File checksums</text><text x="748" y="317" fill="#53647b" font-size="17">Ed25519 signature</text></g><g><rect x="952" y="150" width="200" height="214" rx="12" fill="#0b1730" stroke="#0b1730"/><rect x="952" y="150" width="200" height="5" rx="3" fill="#df1e7d"/><text x="974" y="195" fill="#f472b6" font-size="14" font-weight="650">05</text><text x="974" y="230" fill="#fff" font-size="23" font-weight="650">Anchor</text><text x="974" y="265" fill="#c8d2e1" font-size="17">Bundle SHA-256</text><text x="974" y="291" fill="#c8d2e1" font-size="17">Flare commitment</text><text x="974" y="317" fill="#c8d2e1" font-size="17">Independent verify</text></g><line x1="48" y1="408" x2="1152" y2="408" stroke="#dce3ee"/><text x="48" y="435" fill="#0b1730" font-size="17" font-weight="600">Settlement moves value.</text><text x="48" y="459" fill="#5b6b82" font-size="17">ProofRails makes the payment usable by finance systems and verifiable by software.</text></g></svg>