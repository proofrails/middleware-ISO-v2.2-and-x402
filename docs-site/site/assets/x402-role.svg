<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">The role of x402 in ProofRails</title><desc id="desc">x402 handles a payment-gated HTTP exchange. The resulting settlement and response then enter the ProofRails engine to create durable receipt evidence.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#079bc9"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#df1e7d"/></marker></defs><rect width="1200" height="500" rx="18" fill="#fbfcfe"/><g font-family="Inter,Arial"><text x="55" y="54" fill="#0b1730" font-size="27" font-weight="700">Payment exchange first, evidence record second</text>
<rect x="55" y="100" width="1090" height="138" rx="14" fill="#f2fbfd" stroke="#8bd2e5"/><text x="82" y="132" fill="#087fa3" font-size="12" font-weight="700" letter-spacing="1.4">X402 PAYMENT EXCHANGE</text><rect x="90" y="155" width="190" height="56" rx="9" fill="#fff" stroke="#b9e2ed"/><text x="185" y="188" text-anchor="middle" fill="#0b1730" font-size="15">HTTP request</text><path d="M280 183H375" stroke="#079bc9" stroke-width="3" marker-end="url(#a)"/><rect x="385" y="145" width="220" height="76" rx="9" fill="#fff" stroke="#b9e2ed"/><text x="495" y="176" text-anchor="middle" fill="#0b1730" font-size="15">402 challenge</text><text x="495" y="199" text-anchor="middle" fill="#68788d" font-size="12">Sign accepted option</text><path d="M605 183H700" stroke="#079bc9" stroke-width="3" marker-end="url(#a)"/><rect x="710" y="145" width="200" height="76" rx="9" fill="#fff" stroke="#b9e2ed"/><text x="810" y="176" text-anchor="middle" fill="#0b1730" font-size="15">Settlement</text><text x="810" y="199" text-anchor="middle" fill="#68788d" font-size="12">USD₮0 on Flare</text><path d="M910 183H980" stroke="#079bc9" stroke-width="3" marker-end="url(#a)"/><rect x="990" y="155" width="120" height="56" rx="9" fill="#fff" stroke="#b9e2ed"/><text x="1050" y="188" text-anchor="middle" fill="#0b1730" font-size="15">HTTP 200</text>
<path d="M810 238V294" stroke="#df1e7d" stroke-width="3" marker-end="url(#p)"/><rect x="260" y="304" width="680" height="136" rx="14" fill="#fff7fb" stroke="#efb4d1"/><text x="290" y="338" fill="#df1e7d" font-size="12" font-weight="700" letter-spacing="1.4">PROOFRAILS EVIDENCE ENGINE</text><text x="290" y="379" fill="#0b1730" font-size="16">Settlement + protected response + business reference</text><text x="290" y="411" fill="#3e4e65" font-size="15">Receipt · resource hash · finance artifacts · signed bundle · onchain commitment</text></g></svg>