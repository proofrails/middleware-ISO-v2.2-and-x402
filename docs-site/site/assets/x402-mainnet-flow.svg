<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">ProofRails paid-resource integration</title><desc id="desc">A client signs a USDt0 authorization, the ProofRails facilitator settles on Flare, the protected API delivers its resource, and ProofRails creates and anchors the receipt bundle.</desc><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfcff"/><stop offset="1" stop-color="#fff6fb"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#df1e7d"/></marker></defs><rect x="1" y="1" width="1198" height="558" rx="18" fill="url(#wash)" stroke="#dce3ee"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" fill="#0b1730" font-size="28" font-weight="650">Paid resource → anchored receipt</text><text x="48" y="88" fill="#5b6b82" font-size="17">ProofRails-specific USD₮0 flow on Flare mainnet</text><g><rect x="48" y="128" width="190" height="92" rx="10" fill="#fff" stroke="#cdd6e4"/><text x="143" y="168" fill="#0b1730" text-anchor="middle" font-size="21" font-weight="650">Client / agent</text><text x="143" y="195" fill="#68788d" text-anchor="middle" font-size="15">wallet + signer</text><rect x="276" y="128" width="190" height="92" rx="10" fill="#fff" stroke="#cdd6e4"/><text x="371" y="168" fill="#0b1730" text-anchor="middle" font-size="21" font-weight="650">Protected API</text><text x="371" y="195" fill="#68788d" text-anchor="middle" font-size="15">config + resource</text><rect x="504" y="128" width="190" height="92" rx="10" fill="#fff" stroke="#cdd6e4"/><text x="599" y="168" fill="#0b1730" text-anchor="middle" font-size="20" font-weight="650">X402Facilitator</text><text x="599" y="195" fill="#68788d" text-anchor="middle" font-size="15">USD₮0 settlement</text><rect x="732" y="128" width="190" height="92" rx="10" fill="#fff" stroke="#cdd6e4"/><text x="827" y="168" fill="#0b1730" text-anchor="middle" font-size="21" font-weight="650">Receipt API</text><text x="827" y="195" fill="#68788d" text-anchor="middle" font-size="15">bundle + artifacts</text><rect x="960" y="128" width="192" height="92" rx="10" fill="#0b1730" stroke="#0b1730"/><text x="1056" y="168" fill="#fff" text-anchor="middle" font-size="21" font-weight="650">Flare</text><text x="1056" y="195" fill="#c8d2e1" text-anchor="middle" font-size="15">settlement + anchor</text></g><g fill="none" stroke="#aeb9c8" stroke-width="2"><path d="M143 220v278M371 220v278M599 220v278M827 220v278M1056 220v278" stroke-dasharray="5 7"/></g><g fill="none" stroke="#df1e7d" stroke-width="2.5" marker-end="url(#arrow)"><path d="M143 267h218"/><path d="M143 319h446"/><path d="M599 371h447"/><path d="M371 423H153"/><path d="M371 475h446"/><path d="M827 527h219"/></g><g font-size="15" fill="#0b1730"><text x="218" y="257">1  Read configuration</text><text x="275" y="309">2  Sign USD₮0 authorization</text><text x="746" y="361">3  Settle on Flare</text><text x="203" y="413">4  Deliver resource</text><text x="510" y="465">5  Create receipt + signed bundle</text><text x="900" y="517">6  Anchor bundle hash</text></g><g fill="#df1e7d" font-size="13" font-family="JetBrains Mono,monospace"><text x="48" y="542">PROOFRAILS HTTP EXCHANGE</text></g></g></svg>