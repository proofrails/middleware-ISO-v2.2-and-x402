<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">ProofRails product map</title><desc id="desc">Existing payments and x402 paid API calls enter the ProofRails evidence engine, which produces receipts, delivery evidence, financial artifacts, signed bundles and Flare hash commitments.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#df1e7d"/></marker><linearGradient id="g" x1="0" x2="1"><stop stop-color="#fff7fb"/><stop offset="1" stop-color="#f2fbfd"/></linearGradient></defs>
<rect width="1200" height="520" rx="18" fill="#fbfcfe"/><text x="60" y="58" fill="#0b1730" font-family="Inter,Arial" font-size="28" font-weight="700">One evidence engine, multiple payment inputs</text>
<g font-family="Inter,Arial"><rect x="60" y="120" width="250" height="92" rx="12" fill="#fff" stroke="#dfe5ee"/><text x="90" y="158" fill="#0b1730" font-size="17" font-weight="650">Existing payment</text><text x="90" y="184" fill="#68788d" font-size="13">Transaction + business context</text>
<rect x="60" y="278" width="250" height="92" rx="12" fill="#fff" stroke="#dfe5ee"/><text x="90" y="316" fill="#0b1730" font-size="17" font-weight="650">x402 paid API call</text><text x="90" y="342" fill="#68788d" font-size="13">Settlement + delivered response</text>
<path d="M310 166H410" stroke="#df1e7d" stroke-width="3" marker-end="url(#a)"/><path d="M310 324H410" stroke="#df1e7d" stroke-width="3" marker-end="url(#a)"/>
<rect x="420" y="112" width="300" height="270" rx="16" fill="url(#g)" stroke="#df1e7d" stroke-width="2"/><text x="455" y="153" fill="#df1e7d" font-size="12" font-weight="700" letter-spacing="1.5">PROOFRAILS ENGINE</text>
<text x="455" y="196" fill="#0b1730" font-size="17" font-weight="650">1  Normalize receipt</text><text x="455" y="233" fill="#0b1730" font-size="17" font-weight="650">2  Hash delivered bytes</text><text x="455" y="270" fill="#0b1730" font-size="17" font-weight="650">3  Generate finance artifacts</text><text x="455" y="307" fill="#0b1730" font-size="17" font-weight="650">4  Sign evidence bundle</text><text x="455" y="344" fill="#0b1730" font-size="17" font-weight="650">5  Anchor current bundle hash</text>
<path d="M720 247H810" stroke="#df1e7d" stroke-width="3" marker-end="url(#a)"/>
<rect x="820" y="92" width="320" height="320" rx="16" fill="#fff" stroke="#dfe5ee"/><text x="855" y="133" fill="#0b1730" font-size="19" font-weight="700">Outputs</text>
<g fill="#3e4e65" font-size="15"><text x="855" y="177">Receipt and lifecycle</text><text x="855" y="216">Delivery resource hash</text><text x="855" y="255">ISO 20022-style artifacts</text><text x="855" y="294">Signed evidence.zip</text><text x="855" y="333">Flare anchor transaction</text><text x="855" y="372">Public verification result</text></g>
<text x="60" y="465" fill="#68788d" font-size="13">The hosted service runs the API, workers, storage, receipt pages and verifier around this engine.</text></g></svg>